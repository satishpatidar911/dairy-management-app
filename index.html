<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥛</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Dairy Farming Management System - Complete Animal, Milk, Customer, Accounts & Feed Management" />
    <title>Dairy Farm Pro | दुग्ध प्रबंधन सिस्टम</title>
    
    <!-- Google Fonts for Hindi & English UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Hide and remove Netlify badge / drawer -->
    <style>
      [data-netlify-deploy-preview-banner],
      [class*="netlify"],
      body > *:not(#root):not(script),
      [data-netlify-deploy-preview-banner],
      [class*="netlify"],
      [id*="netlify"],
      iframe[src*="netlify"],
      a[href*="netlify.com"],
      netlify-drawer {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        z-index: -999999 !important;
      }
    </style>
    <script>
      (function() {
        function removeInjected() {
          if (!document.body) return;
          var children = Array.from(document.body.children);
          for (var i = 0; i < children.length; i++) {
            var el = children[i];
            if (el.id !== 'root' && el.tagName !== 'SCRIPT') {
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('opacity', '0', 'important');
              try { el.remove(); } catch(e) {}
            }
          }
        }
        removeInjected();
        var timer = setInterval(removeInjected, 40);
        setTimeout(function() { clearInterval(timer); setInterval(removeInjected, 200); }, 5000);
        document.addEventListener('DOMContentLoaded', removeInjected);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-dairy-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
